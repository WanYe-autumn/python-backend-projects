name: Library API CI

on:
  push:
    paths:
      - "01-library-book/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "01-library-book/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 01-library-book

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: library_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: library_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U library_user -d library_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://library_user:test_password@127.0.0.1:5432/library_test
      TEST_DATABASE_URL: postgresql+psycopg://library_user:test_password@127.0.0.1:5432/library_test
      JWT_SECRET_KEY: ci-only-test-secret-key

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 01-library-book/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q